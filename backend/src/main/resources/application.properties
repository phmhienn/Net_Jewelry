spring.application.name=jewelry-store
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jewelry_store?createDatabaseIfNotExist=true&connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
server.error.include-stacktrace=never
server.error.include-message=never
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:15}
app.cors.origins=${CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:./uploads}
app.shipping.fee=${SHIPPING_FEE:30000}
app.shipping.free-threshold=${FREE_SHIPPING_THRESHOLD:1500000}
app.bootstrap.enabled=${BOOTSTRAP_MANAGER_ENABLED:false}
app.bootstrap.name=${ADMIN_NAME:}
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.username=${ADMIN_USERNAME:}
app.bootstrap.password=${ADMIN_PASSWORD:}
app.reset.frontend-url=${FRONTEND_URL:http://127.0.0.1:5173}
app.reset.mail-enabled=${RESET_MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@example.test}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}



