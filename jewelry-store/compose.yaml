name: jewelry-store

services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_DATABASE: jewelry_store
      MYSQL_USER: jewelry
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - jewelry_mysql:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./verify-data.sql:/checks/verify-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u jewelry -D jewelry_store -e 'SELECT COUNT(*) FROM noi_dung_trang' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:mysql://mysql:3306/jewelry_store?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: jewelry
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DDL_AUTO: validate
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      UPLOAD_DIR: /app/uploads
      SHIPPING_FEE: ${SHIPPING_FEE:-30000}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-1500000}
      BOOTSTRAP_MANAGER_ENABLED: ${BOOTSTRAP_MANAGER_ENABLED:-false}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RESET_MAIL_ENABLED: ${RESET_MAIL_ENABLED:-false}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - jewelry_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/storefront/settings"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.9
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  jewelry_mysql:
  jewelry_uploads:
